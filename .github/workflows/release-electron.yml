name: Release Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./electron

      - name: Build Electron App
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            bunx electron-builder --mac --projectDir=electron --publish=never
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            bunx electron-builder --win --projectDir=electron --publish=never
          else
            bunx electron-builder --linux --projectDir=electron --publish=never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds: skip certificate discovery and notarization.
          # macOS users may need to right-click > Open the first time.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          APPLE_ID: ''
          APPLE_ID_PASS: ''
          APPLE_TEAM_ID: ''

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            electron/dist/**/*.dmg
            electron/dist/**/*.zip
            electron/dist/**/*.AppImage
            electron/dist/**/*.deb
            electron/dist/**/*.exe
            electron/dist/**/*.nsis.7z
            electron/dist/**/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: electron/dist/**
          retention-days: 30